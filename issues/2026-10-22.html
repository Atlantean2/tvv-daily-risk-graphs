<figure class="g"><img src="img/2026-10-22/g01.webp" alt="Oil geopolitical risk: off the March peak, still high" loading="lazy"><figcaption><span class="t">Oil geopolitical risk: off the March peak, still high.</span> Iacoviello&#x27;s oil-related AI-GPR read 752 in September, below the March 2026 record of 1,844 but above the 2003 Iraq-war (515) and 2022 Ukraine (736) readings.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g02.webp" alt="Terrorism share of geopolitical risk" loading="lazy"><figcaption><span class="t">Terrorism share of geopolitical risk.</span> The terrorism component of AI-GPR was 11.1 in September vs 7.0 in August; the 2026 monthly high is 13.3 (March) and the 12-month average is 10.5.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g03.webp" alt="The deadliest conflict zones of 2026" loading="lazy"><figcaption><span class="t">The deadliest conflict zones of 2026.</span> UCDP candidate events Jan-Sep 2026: 138,860 deaths worldwide; Ukraine 63,789, Iran 23,681, Nigeria 6,945, Yemen (North Yemen) 5,063, Lebanon 4,463. Largest one-sided (civilian-targeted) toll: Iran 19,901. UCDP codes organized violence (state, non-state, one-sided), which includes but is not limited to terrorism; candidate data are preliminary and revised monthly.<br><span class="s">Source: <a href="https://ucdp.uu.se/downloads/" target="_blank" rel="noopener">https://ucdp.uu.se/downloads/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g04.webp" alt="Which regions are shaking more?" loading="lazy"><figcaption><span class="t">Which regions are shaking more?.</span> USGS ComCat M5+ through 21:58 UTC Oct 21: 1,631 in 2026 vs a 2016-25 average of 1,394 for the same Jan 1-Oct 21 window. Busiest: Indonesia 222 (avg 138.1), Philippines 132 (avg 56.8), Japan 100 (avg 84.2), Russia 95 (avg 74.0). Biggest excess vs normal (regions averaging 5+): Panama 4.6x, New Caledonia 2.9x, China 2.5x. Regions are USGS place-name tails (country or named region), so offshore zones may split.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&amp;starttime=2016-01-01&amp;minmagnitude=5&amp;orderby=time-asc&amp;limit=20000&amp;eventtype=earthquake" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&amp;starttime=2016-01-01&amp;minmagnitude=5&amp;orderby=time-asc&amp;limit=20000&amp;eventtype=earthquake</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g05.webp" alt="M6+ earthquake pace" loading="lazy"><figcaption><span class="t">M6+ earthquake pace.</span> 2026 has 113 M6+ quakes through Oct 20 vs a 2000-25 median of 116 by this date (range 81-184). Latest: M6.3 197 km NW of Port-Olry, Vanuatu (Oct 20, 04:20 UTC). 12 duplicate USGS solution(s) of the same event merged.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g06.webp" alt="Solar activity proxy: F10.7 flux" loading="lazy"><figcaption><span class="t">Solar activity proxy: F10.7 flux.</span> The 10.7 cm solar radio flux, a standard proxy for solar activity and upper-atmosphere drag on satellites, was 114 sfu on Oct 21 (27-day average 113; window range 92-156).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions" target="_blank" rel="noopener">https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g07.webp" alt="Geomagnetic activity, last 30 days" loading="lazy"><figcaption><span class="t">Geomagnetic activity, last 30 days.</span> Kp peaked at 7.00 on Oct 10 in this 30-day window; Oct 21 maxed at Kp 4.67 (UTC day), and NOAA&#x27;s latest 3-day forecast (issued 2026 Oct 22 0030 UTC) has a peak Kp 4.67 (NOAA Scale G1) on Oct 22.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/planetary-k-index" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/planetary-k-index</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g08.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> The monthly sunspot number was 60 in September, past the Oct 2024 maximum; declining phases can still bring large flares and CME storms such as Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g09.webp" alt="Brent-WTI premium: $38 to $7" loading="lazy"><figcaption><span class="t">Brent-WTI premium: $38 to $7.</span> EIA daily spot: Brent $115.22, WTI $107.89 on Oct 20, a $7.33 Brent premium, down from $37.62 on Oct 2 (2024 average $3.93). A wide Brent premium signals seaborne (Gulf-exposed) crude scarcity relative to landlocked US supply; the narrowing means that stress has eased on paper even as both prices stay high.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/RBRTED.htm" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/RBRTED.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g10.webp" alt="US emergency oil buffer" loading="lazy"><figcaption><span class="t">US emergency oil buffer.</span> The SPR held 282.7M barrels in the week to Oct 16, its lowest since 1982 and 39% of its 2010 peak (727M); commercial crude was 412.5M.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g11.webp" alt="US refinery runs vs normal" loading="lazy"><figcaption><span class="t">US refinery runs vs normal.</span> US refineries ran at 93.4% of capacity in the week to Oct 16, vs a 2021-25 average of 87.5% for that week (range 85.1-89.5%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-22/g12.webp" alt="Arizona&#x27;s wet October" loading="lazy"><figcaption><span class="t">Arizona&#x27;s wet October.</span> Flagstaff area (NOAA ACIS threaded record) logged 4.38 in. of precipitation Oct 1-21, 2026, about 4.4x the 1991-2020 average of 1.00 in. and the 2nd-wettest Oct 1-21 since 1950 (only 1972 was wetter, 8.46 in.). Biggest day: 1.98 in. on Oct 11. Context for the Oct 21 Clifton mud flood and Moenkopi Wash debris-flow warnings (both elsewhere in Arizona; this is one station, not a statewide total).<br><span class="s">Source: <a href="https://data.rcc-acis.org/StnData?sid=FLGthr&amp;sdate=1950-01-01&amp;edate=2026-10-22&amp;elems=pcpn&amp;output=json" target="_blank" rel="noopener">https://data.rcc-acis.org/StnData?sid=FLGthr&amp;sdate=1950-01-01&amp;edate=2026-10-22&amp;elems=pcpn&amp;output=json</a></span></figcaption></figure>
