<figure class="g"><img src="img/2026-10-28/g01.webp" alt="Where the earth shook this month" loading="lazy"><figcaption><span class="t">Where the earth shook this month.</span> USGS logged 726 M4.5+ quakes in the 30 days to Oct 28, 18 of them M6+; the largest was M7.7 12 km WSW of Pitaloza Arriba, Panama on Oct 9 (UTC).<br><span class="s">Source: <a href="https://earthquake.usgs.gov/earthquakes/map/" target="_blank" rel="noopener">https://earthquake.usgs.gov/earthquakes/map/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g02.webp" alt="Solar activity proxy: F10.7 flux" loading="lazy"><figcaption><span class="t">Solar activity proxy: F10.7 flux.</span> The 10.7 cm solar radio flux, a standard proxy for solar activity and upper-atmosphere drag on satellites, was 89 sfu on Oct 27 (27-day average 112; window range 89-156).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions" target="_blank" rel="noopener">https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g03.webp" alt="Cushing swings from tank bottoms to a glut" loading="lazy"><figcaption><span class="t">Cushing swings from tank bottoms to a glut.</span> Crude stocks at Cushing, the delivery point for NYMEX WTI futures, were 27.6M barrels in the week to Oct 16, vs a 2021-25 average of 24.3M for that week (range 21.2-27.3M, so above the five-year high); the 2021-26 low was 18.6M (Jul 24, 2026). EIA&#x27;s report for the week to Oct 23 is due 10:30 AM ET today, after this build. The 20M-barrel floor is an industry rule of thumb, not an EIA figure.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=W_EPC0_SAX_YCUOK_MBBL&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=W_EPC0_SAX_YCUOK_MBBL&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g04.webp" alt="The 2-year yield says hikes are coming" loading="lazy"><figcaption><span class="t">The 2-year yield says hikes are coming.</span> Before today&#x27;s FOMC decision the 2-year Treasury yield (4.68%, Oct 26) sat +0.80 pp vs the effective fed funds rate (3.88%); last this high on Sep 25, 2026. 12-month range of the gap: -0.65 to +1.11 pp. A positive gap means the market prices a higher policy rate over the next two years. Pre-decision data only.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/DGS2" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/DGS2</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g05.webp" alt="Oil shock at the pump" loading="lazy"><figcaption><span class="t">Oil shock at the pump.</span> EIA Brent spot was $115.22 on Oct 20 (period peak $138 in April 2026); EIA&#x27;s US regular gasoline average was $4.27 in the week of Oct 26. Both EIA series lag the market by about a week.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/DCOILBRENTEU" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/DCOILBRENTEU</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g06.webp" alt="Inflation expectations in the bond market" loading="lazy"><figcaption><span class="t">Inflation expectations in the bond market.</span> On Oct 27 the 10Y par yield was 4.99% and the 10Y real (TIPS) yield 2.64%, a breakeven of 2.35 points (2026 range 2.18-2.50). Breakeven also carries an inflation-risk premium.<br><span class="s">Source: <a href="https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_real_yield_curve&amp;field_tdr_date_value=2026" target="_blank" rel="noopener">https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_real_yield_curve&amp;field_tdr_date_value=2026</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g07.webp" alt="Bills vs notes before the FOMC" loading="lazy"><figcaption><span class="t">Bills vs notes before the FOMC.</span> US Treasury par yields on Oct 27: 3-month 4.22%, 2-year 4.70%, 10-year 4.99%. The 2-year sits 48 bp above the 3-month bill (vs -18 bp on Jan 2, low -29 bp on Feb 27), i.e. markets price higher policy rates ahead; the FOMC decides Oct 28.<br><span class="s">Source: <a href="https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026" target="_blank" rel="noopener">https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-28/g08.webp" alt="The whole curve, not just 10Y-2Y" loading="lazy"><figcaption><span class="t">The whole curve, not just 10Y-2Y.</span> On Oct 27 the curve ran from 4.22% (3-month) to 5.30% (30-year), with 2Y 4.70% and 10Y 4.99%; since Sep 25 the 2Y moved -11 bp and the 10Y -18 bp.<br><span class="s">Source: <a href="https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026" target="_blank" rel="noopener">https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026</a></span></figcaption></figure>
