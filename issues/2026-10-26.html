<figure class="g"><img src="img/2026-10-26/g01.webp" alt="Where geopolitical risk is concentrated" loading="lazy"><figcaption><span class="t">Where geopolitical risk is concentrated.</span> In September 2026, United States (3.91% of articles, vs 3.61% in 2025), Israel (1.61%) and Russia (1.48%) led the Caldara-Iacoviello country GPR rankings.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g02.webp" alt="Violence against civilians in context" loading="lazy"><figcaption><span class="t">Violence against civilians in context.</span> UCDP&#x27;s candidate events record 138,860 deaths Jan-Sep 2026, 27,236 of them in one-sided violence against civilians (top: Iran 19,901, Nigeria 1,884, DR Congo (Zaire) 1,357). January&#x27;s 39,878 is mostly UCDP&#x27;s estimate for the Iranian government&#x27;s Jan 8 killings of civilians (state, not terrorist, violence); September 13,286. Candidate data are preliminary.<br><span class="s">Source: <a href="https://ucdp.uu.se/downloads/index.html#candidate" target="_blank" rel="noopener">https://ucdp.uu.se/downloads/index.html#candidate</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g03.webp" alt="Weekly M5+ quake count" loading="lazy"><figcaption><span class="t">Weekly M5+ quake count.</span> 2026 has 1,675 M5+ quakes through Oct 26 vs a 2016-25 average of 1,414 by this date (range 1,216-1,905); the busiest 2026 week was week 33 with 67.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g04.webp" alt="The month ahead in space weather" loading="lazy"><figcaption><span class="t">The month ahead in space weather.</span> SWPC&#x27;s 27-day outlook (issued 2026 Oct 26 0118 UTC) flags its next Kp 5 (G1-level) days on Oct 31, with radio flux 80-88 sfu. It is a recurrence-based outlook, not a storm warning.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/27-day-outlook-107-cm-radio-flux-and-geomagnetic-indices" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/27-day-outlook-107-cm-radio-flux-and-geomagnetic-indices</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g05.webp" alt="Where the AI build-out is, and how it is financed" loading="lazy"><figcaption><span class="t">Where the AI build-out is, and how it is financed.</span> TVV&#x27;s project file tracks 74 large AI data-center campuses worldwide, 52 in the US (42.1 GW of disclosed capacity). Disclosed project financing totals $194B for US sites; 10 US campuses use SPV bonds or off-balance-sheet JVs ($104B, led by Meta Hyperion $27.3B and El Paso $12.5B). Locations approximate.<br><span class="s">Source: <a href="https://epoch.ai/data/data-centers" target="_blank" rel="noopener">https://epoch.ai/data/data-centers</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g06.webp" alt="The liquidity buffer is empty" loading="lazy"><figcaption><span class="t">The liquidity buffer is empty.</span> The Fed&#x27;s overnight reverse repo facility held $0.2B on Oct 23, down from $2,554B (Dec 30, 2022). The Treasury&#x27;s cash account was $952B (Oct 21) and bank reserves $2,963B (Oct 21); with the RRP cushion spent, further TGA rebuilds or QT come straight out of reserves. FOMC Oct 28.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/RRPONTSYD" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/RRPONTSYD</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g07.webp" alt="Critical Water Shortage, US view" loading="lazy"><figcaption><span class="t">Critical Water Shortage, US view.</span> 50.7% of the contiguous US was in drought (D1-D4) on the map valid Oct 20, higher than in 91% of weeks since 2000; 9.4% was extreme or worse.<br><span class="s">Source: <a href="https://droughtmonitor.unl.edu/DmData/DataDownload.aspx" target="_blank" rel="noopener">https://droughtmonitor.unl.edu/DmData/DataDownload.aspx</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g08.webp" alt="Gold in yen: the weak-currency hedge" loading="lazy"><figcaption><span class="t">Gold in yen: the weak-currency hedge.</span> World Bank monthly gold averaged $4,319/oz in September 2026, 2.8x Jan 2020; priced in yen (FRED monthly-average JPY) it was ¥675,566/oz, 4.0x, because the dollar bought 156.4 yen vs 109.3 in Jan 2020. Latest daily rate 158.00 (Oct 16). BoJ decides Oct 29-30.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g09.webp" alt="The average stock is beating the megacaps" loading="lazy"><figcaption><span class="t">The average stock is beating the megacaps.</span> Through Fri Oct 23, SPY (cap-weighted) is +11.4% in 2026 vs +13.0% for RSP (equal-weighted), so cap-weight trails by 1.6 pp (cap-weight lead peaked at +4.0 pp on Oct 7; deepest lag -6.4 pp on Feb 27). The equal-weight lead means 2026 gains are broader than the megacap story; Big Tech results Oct 28-29 test whether cap-weight catches up or falls further behind.<br><span class="s">Source: <a href="https://www.nasdaq.com/market-activity/etf/rsp/historical" target="_blank" rel="noopener">https://www.nasdaq.com/market-activity/etf/rsp/historical</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g10.webp" alt="Ukraine ceasefire odds" loading="lazy"><figcaption><span class="t">Ukraine ceasefire odds.</span> Odds of a Russia-Ukraine ceasefire by Dec 31 are 16.5% (from 46% in May); by mid-2027 they are 52.5%.<br><span class="s">Source: <a href="https://polymarket.com/event/russia-x-ukraine-ceasefire-agreement-by" target="_blank" rel="noopener">https://polymarket.com/event/russia-x-ukraine-ceasefire-agreement-by</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g11.webp" alt="The US-China AI model race" loading="lazy"><figcaption><span class="t">The US-China AI model race.</span> Epoch&#x27;s database lists 88 notable AI models for 2026 to Oct 12: 53 from US organizations and 29 from Chinese ones (2025: 62 US, 33 China, 107 total). Recent years fill in as Epoch adds models.<br><span class="s">Source: <a href="https://epoch.ai/data/ai-models" target="_blank" rel="noopener">https://epoch.ai/data/ai-models</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g12.webp" alt="The hidden AI lease bill" loading="lazy"><figcaption><span class="t">The hidden AI lease bill.</span> Signed but not-yet-commenced leases (ASC 842, mostly data centers) total $1,195B across Meta, Microsoft, Oracle, Amazon and Alphabet in their latest filings; for the four with year-ago figures they rose from $275B to $1,058B. Meta $356B (+512%), Microsoft $329B, Oracle $288B (+189%). These obligations sit outside reported debt until each lease starts. Big Tech reports Oct 28-29.<br><span class="s">Source: <a href="https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm" target="_blank" rel="noopener">https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-26/g13.webp" alt="Capex vs bonds before earnings" loading="lazy"><figcaption><span class="t">Capex vs bonds before earnings.</span> 2026 capex guidance: Amazon $220B, Alphabet $200B, Microsoft $175B, Meta $137.5B, Oracle $92.5B (FY27 midpoint). Amazon, Alphabet, Meta and Oracle sold $250B of USD bonds Jan 2025-Oct 2026; Oracle&#x27;s $50.8B equals 55% of a year&#x27;s capex (Meta&#x27;s excludes $27.3B of Hyperion SPV notes). Earnings Oct 28-29.<br><span class="s">Source: <a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/" target="_blank" rel="noopener">https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/</a></span></figcaption></figure></main></body></html>
