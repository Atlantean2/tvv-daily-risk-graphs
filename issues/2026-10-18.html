<figure class="g"><img src="img/2026-10-18/g04.webp" alt="Where the earth shook this month" loading="lazy"><figcaption><span class="t">Where the earth shook this month.</span> USGS logged 619 M4.5+ quakes in the 30 days to Oct 18, 12 of them M6+; the largest was M7.7 12 km WSW of Pitaloza Arriba, Panama on Oct 9 (UTC).<br><span class="s">Source: <a href="https://earthquake.usgs.gov/earthquakes/map/" target="_blank" rel="noopener">https://earthquake.usgs.gov/earthquakes/map/</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-18/g06.webp" alt="Solar wind right now" loading="lazy"><figcaption><span class="t">Solar wind right now.</span> Solar wind is 475 km/s (24-hour range 401-540) and Bz is +2.5 nT (24-hour low -6.5 nT), with NOAA forecasting a peak Kp of 5.00 (G1 minor storm) on Oct 20 (forecast issued 2026 Oct 18 0030 UTC).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/real-time-solar-wind" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/real-time-solar-wind</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g07.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> Sunspots (60 in September) are past peak, but declining phases still bring large flares and CME storms like Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g08.webp" alt="North magnetic pole drift (measured)" loading="lazy"><figcaption><span class="t">North magnetic pole drift (measured).</span> North magnetic pole drift, 1900-2025, with WMM2025 forecast to 2030. Data through 2025 (NOAA NCEI NP.xy), retrieved Oct 17, 2026; speeds computed by TVV as great-circle distance between yearly positions.<br><span class="s">Source: <a href="https://www.ncei.noaa.gov/products/wandering-geomagnetic-poles" target="_blank" rel="noopener">https://www.ncei.noaa.gov/products/wandering-geomagnetic-poles</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g09.webp" alt="US fuel stocks" loading="lazy"><figcaption><span class="t">US fuel stocks.</span> In the week to Oct 9, US gasoline stocks were 208.3M barrels (-3.8% vs the 2021-25 average) and distillate stocks 102.6M (-11.1%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WGTSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WGTSTUS1&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g10.webp" alt="Winter gas buffer" loading="lazy"><figcaption><span class="t">Winter gas buffer.</span> Lower-48 working gas stood at 3,567 Bcf on Oct 9, -0.1% vs the 2021-25 average for that week (3,569 Bcf), heading into the winter heating season.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/ng/hist/nw2_epg0_swo_r48_bcfw.htm" target="_blank" rel="noopener">https://www.eia.gov/dnav/ng/hist/nw2_epg0_swo_r48_bcfw.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g11.webp" alt="US refineries running hard" loading="lazy"><figcaption><span class="t">US refineries running hard.</span> US refineries ran at 93.5% of capacity in the week to Oct 9, vs a 2021-25 average of 86.7% for that week (range 84.7-89.5%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g12.webp" alt="Yield curve after inversion" loading="lazy"><figcaption><span class="t">Yield curve after inversion.</span> The 10Y-2Y spread is back positive at +0.35 after the 2022-24 inversion (Treasury: 10Y 5.09%, 2Y 4.74% Oct 16), the un-inversion phase that preceded past recessions.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/T10Y2Y" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/T10Y2Y</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g13.webp" alt="Energy-driven inflation re-acceleration" loading="lazy"><figcaption><span class="t">Energy-driven inflation re-acceleration.</span> Headline CPI jumped to 3.7% in September while core sat at 2.6%: an energy-led shock pushing the Fed toward hikes.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CPIAUCNS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CPIAUCNS</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-18/g14.webp" alt="Credit markets: calm, maybe complacent" loading="lazy"><figcaption><span class="t">Credit markets: calm, maybe complacent.</span> The high-yield spread was 3.16 pt on Oct 13, well inside its 3-year range (2.59-4.61) and far from stress levels, and the St. Louis Fed stress index read -0.72, below normal and lower than 88% of weeks since 2007: credit is not yet pricing the geopolitical and oil risk.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/BAMLH0A0HYM2" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/BAMLH0A0HYM2</a></span></figcaption></figure>
