<figure class="g"><img src="img/2026-10-29/g14.webp" alt="Warsh&#x27;s &#x27;lowest claims in generations&#x27; holds when scaled to the workforce" loading="lazy"><figcaption><span class="t">Warsh&#x27;s &#x27;lowest claims in generations&#x27; holds when scaled to the workforce.</span> At the Oct 28 press conference Chair Warsh said the 4-week average of jobless claims runs at the lowest level in generations. FRED IC4WSA was 197.75K in the week to Oct 17; as a share of payrolls (159.0M, Sep) that is 0.124%, a record low in data since 1967; series low 0.124% (Oct 2026). In raw numbers claims were last this low in Oct 2022. The Fed held at 3.75-4.00% with two hike dissents (Cook, Hammack).<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/IC4WSA" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/IC4WSA</a></span></figcaption></figure>
