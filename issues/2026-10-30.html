<figure class="g"><img src="img/2026-10-30/g01.webp" alt="Israel voted Oct 27 at war-level risk" loading="lazy"><figcaption><span class="t">Israel voted Oct 27 at war-level risk.</span> Israel&#x27;s country GPR read 1.61% of articles in September 2026, 6.0x its Jan 2015-Sep 2023 average (0.27%); before Oct 7, 2023 the peak was 0.97% (May 2018). None of the five 2019-2022 elections came close to today&#x27;s risk level. Held at Sep 2026 (monthly; next update early Nov).<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g02.webp" alt="Who is killing civilians" loading="lazy"><figcaption><span class="t">Who is killing civilians.</span> UCDP&#x27;s preliminary data record 6,141 civilians killed by non-state armed groups in Jan-Sep 2026 (480 in September); Islamic State groups account for 1,525, and Nigeria (1,826) and DR Congo (1,323) lead by country.<br><span class="s">Source: <a href="https://ucdp.uu.se/downloads/" target="_blank" rel="noopener">https://ucdp.uu.se/downloads/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g03.webp" alt="M6+ quakes by month" loading="lazy"><figcaption><span class="t">M6+ quakes by month.</span> October 2026 has 20 M6+ quakes through Oct 29 vs a 2000-25 full-October average of 12.4; the busiest 2026 month was Oct (20).<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g04.webp" alt="Space weather this week: flares, Kp, Dst" loading="lazy"><figcaption><span class="t">Space weather this week: flares, Kp, Dst.</span> Peak observed Kp this week was 4.33 (Oct 23); Dst minimum -29 nT (Oct 23), latest 9 nT. The week&#x27;s biggest flare was C2.9 (Oct 26). NOAA forecasts a peak Kp 5.00 (NOAA Scale G1) for Oct 31 (issued 2026 Oct 30 0030 UTC).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/goes-x-ray-flux" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/goes-x-ray-flux</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g05.webp" alt="Brent-WTI premium: $38 to $20" loading="lazy"><figcaption><span class="t">Brent-WTI premium: $38 to $20.</span> EIA daily spot: Brent $123.10, WTI $103.37 on Oct 27, a $19.73 Brent premium, down from $37.62 on Oct 2 (2024 average $3.93). A wide Brent premium signals seaborne (Gulf-exposed) crude scarcity relative to landlocked US supply; the narrowing means that stress has eased on paper even as both prices stay high.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/RBRTED.htm" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/RBRTED.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g06.webp" alt="Hot growth, hot prices" loading="lazy"><figcaption><span class="t">Hot growth, hot prices.</span> BEA advance estimate (Oct 29): real GDP grew 3.4% annualized in Q3 2026 after 2.2% in Q2; final sales to private domestic purchasers rose 4.9%. September PCE inflation was 3.6% y/y (core 3.1%), above the Fed&#x27;s 2% goal; the FOMC held at 3.75-4.00% on Oct 28. Next GDP estimate Nov 25.<br><span class="s">Source: <a href="https://www.bea.gov/news/2026/gdp-advance-estimate-3rd-quarter-2026" target="_blank" rel="noopener">https://www.bea.gov/news/2026/gdp-advance-estimate-3rd-quarter-2026</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g07.webp" alt="Respiratory season starting" loading="lazy"><figcaption><span class="t">Respiratory season starting.</span> In the week ending Oct 17, US hospitals reported 3,974 new COVID-19 admissions (-4% week on week), 4,849 for influenza and 811 for RSV, all far below last winter&#x27;s peaks (flu peak 42,500).<br><span class="s">Source: <a href="https://data.cdc.gov/Public-Health-Surveillance/Weekly-Hospital-Respiratory-Data-HRD-Metrics-by-Ju/ua7e-t2fy" target="_blank" rel="noopener">https://data.cdc.gov/Public-Health-Surveillance/Weekly-Hospital-Respiratory-Data-HRD-Metrics-by-Ju/ua7e-t2fy</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g08.webp" alt="Gold-to-silver ratio" loading="lazy"><figcaption><span class="t">Gold-to-silver ratio.</span> An ounce of gold buys 78.6 ounces of silver at the Friday-morning spot (gold $3,981, silver $50.63), vs 66.9 in September and a 1990-2026 average of 70.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g09.webp" alt="Oil volatility vs stock volatility" loading="lazy"><figcaption><span class="t">Oil volatility vs stock volatility.</span> On Oct 29, oil implied volatility (OVX) closed at 57.16, 3.3x the VIX (17.20); gold&#x27;s GVZ was 22.73. OVX&#x27;s 2026 closing high is 120.91 (Mar 11).<br><span class="s">Source: <a href="https://www.cboe.com/us/indices/dashboard/ovx/" target="_blank" rel="noopener">https://www.cboe.com/us/indices/dashboard/ovx/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g10.webp" alt="Israel election odds" loading="lazy"><figcaption><span class="t">Israel election odds.</span> Three days after Israel&#x27;s Oct 27 Knesset election, Polymarket prices Benjamin Netanyahu 40.5%, Gadi Eizenkot 33.3%, Naftali Bennett 5.0% to be the next prime minister (candidates at 5% or more; hourly history since Sep 20).<br><span class="s">Source: <a href="https://polymarket.com/event/who-will-be-the-next-prime-minister-of-israel-after-the-next-election" target="_blank" rel="noopener">https://polymarket.com/event/who-will-be-the-next-prime-minister-of-israel-after-the-next-election</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g11.webp" alt="Amazon and Intel Q3 in numbers" loading="lazy"><figcaption><span class="t">Amazon and Intel Q3 in numbers.</span> From the Q3 10-Qs filed Oct 30: Amazon revenue $201.9B (+12.1% y/y), operating income $28.1B vs $17.4B, net income $20.7B vs $21.2B; capex $77.3B vs $35.1B (38% of revenue) against operating cash flow of $42.4B. Intel revenue $16.5B (+21%), operating income $2.52B vs $0.68B, net income $3.32B vs $4.06B. GAAP figures as tagged in XBRL; quarterly cash flow = 9-month minus 6-month YTD.<br><span class="s">Source: <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0001018724&amp;type=10-Q" target="_blank" rel="noopener">https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0001018724&amp;type=10-Q</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g12.webp" alt="Hyperscaler debt pile" loading="lazy"><figcaption><span class="t">Hyperscaler debt pile.</span> SEC 10-Q/10-K balance sheets (XBRL), long-term debt including current portion: Amazon $180.9B vs $55.1B a year earlier; Alphabet $126.1B vs $23.6B a year earlier; Meta $83.7B vs $28.8B a year earlier; Microsoft $35.5B vs $43.2B a year earlier. Amazon&#x27;s 10-Q filed Oct 30 shows the jump to $180.9B at Sep 30. Microsoft funds more through leases (finance lease liabilities $71.0B), which this chart excludes; operating leases also excluded.<br><span class="s">Source: <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0001018724&amp;type=10-Q" target="_blank" rel="noopener">https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0001018724&amp;type=10-Q</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g13.webp" alt="Openings per layoff" loading="lazy"><figcaption><span class="t">Openings per layoff.</span> BLS JOLTS (August 2026): 7.08M job openings vs 1.64M layoffs and discharges, 4.3 openings per layoff (2019 average 3.9; 2000-26 average 3.1). Layoffs were 1.83M a year earlier; the post-2021 high was 1.90M (Mar 2023). Grey bands = NBER recessions.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/JTSLDL" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/JTSLDL</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g14.webp" alt="Claims back at 2019 levels" loading="lazy"><figcaption><span class="t">Claims back at 2019 levels.</span> DOL (via FRED): 1.701M continuing claims in the week to Oct 17 (1.953M a year earlier; 2019 average 1.68M) vs initial claims of 194K in the week to Oct 24 (2019 average 218K). Continuing claims are 13% below a year ago and within 1% of the 2019 average: no sign yet in UI data of the broad AI-driven layoff wave that is feared; claims count only insured workers.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CCSA" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CCSA</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g15.webp" alt="Entry-level squeeze" loading="lazy"><figcaption><span class="t">Entry-level squeeze.</span> BLS (CPS via FRED, not seasonally adjusted for the degree series): bachelor&#x27;s-degree holders aged 20-24 had 7.6% unemployment in September 2026 vs 4.2% for all workers and 2.5% for bachelor&#x27;s holders 25+. On 12-month averages (removing the school-year seasonality) the young-grad gap is +2.6 pp (pre-2020 high +1.7 pp). Entry-level white-collar hiring is where AI substitution is expected to show first, but this series does not isolate AI as a cause.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CGBD2024" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CGBD2024</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g16.webp" alt="Tech jobs lag the economy" loading="lazy"><figcaption><span class="t">Tech jobs lag the economy.</span> BLS payroll survey (September 2026): computer systems design &amp; related services employed 2.36M (-5.2% vs its Mar 2023 peak); information sector 2.74M; total payrolls 159.0M. Both tech-heavy series lag total payrolls since 2022; rate hikes, post-pandemic over-hiring and AI coding tools all overlap, so the chart shows exposure, not proof of AI-caused job loss.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CES6054150001" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CES6054150001</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g17.webp" alt="Hormuz normalisation odds" loading="lazy"><figcaption><span class="t">Hormuz normalisation odds.</span> Polymarket prices a 10.5% chance that Hormuz traffic is back to normal by Dec 31 (11.5% a week earlier), down from 79.5% when the market opened in May.<br><span class="s">Source: <a href="https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-december-31" target="_blank" rel="noopener">https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-december-31</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-30/g18.webp" alt="US emergency oil buffer" loading="lazy"><figcaption><span class="t">US emergency oil buffer.</span> The SPR held 282.6M barrels in the week to Oct 23, its lowest since 1982 and 39% of its 2010 peak (727M); commercial crude was 410.6M.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W</a></span></figcaption></figure></main></body></html>
