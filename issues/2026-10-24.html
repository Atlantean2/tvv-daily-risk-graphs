<figure class="g"><img src="img/2026-10-24/g04.webp" alt="Tibet M7.0 aftershocks" loading="lazy"><figcaption><span class="t">Tibet M7.0 aftershocks.</span> USGS ComCat: the M7.0 quake 191 km ENE of Nagqu, China at 14:33 UTC Oct 22 has been followed by 16 aftershocks of M4.1+ within 200 km through Oct 24 08:39 UTC, the largest M5.3 on Oct 24 UTC. Within 300 km USGS lists 4 earlier M6+ quakes since 1970 (largest M6.9, Apr 13, 2010 UTC). Global catalog: smaller aftershocks below the USGS completeness level are not shown.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/earthquakes/eventpage/us6000u43g/executive" target="_blank" rel="noopener">https://earthquake.usgs.gov/earthquakes/eventpage/us6000u43g/executive</a></span></figcaption></figure>
