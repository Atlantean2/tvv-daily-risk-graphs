<figure class="g"><img src="img/2026-10-20/g01.webp" alt="Oil geopolitical risk: off the March peak, still high" loading="lazy"><figcaption><span class="t">Oil geopolitical risk: off the March peak, still high.</span> Iacoviello&#x27;s oil-related AI-GPR read 752 in September, below the March 2026 record of 1,844 but above the 2003 Iraq-war (515) and 2022 Ukraine (736) readings.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g02.webp" alt="Daily Geopolitical Risk index" loading="lazy"><figcaption><span class="t">Daily Geopolitical Risk index.</span> Daily GPR read 249 on Oct 19 (7-day average 178, 30-day 176) against a 1985-2019 norm of 100; the 2026 daily high so far is 501 on Mar 2.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g03.webp" alt="Threats vs acts" loading="lazy"><figcaption><span class="t">Threats vs acts.</span> In the week to Oct 19 the threats sub-index averaged 207 and the acts sub-index 187 (2026 highs of the 7-day averages: threats 396 on Mar 5, acts 501 on Mar 15).<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g04.webp" alt="Terrorism share of geopolitical risk" loading="lazy"><figcaption><span class="t">Terrorism share of geopolitical risk.</span> The terrorism component of AI-GPR was 11.1 in September vs 7.0 in August; the 2026 monthly high is 13.3 (March) and the 12-month average is 10.5.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g05.webp" alt="Terror in the news" loading="lazy"><figcaption><span class="t">Terror in the news.</span> Worldwide news coverage of terror attacks ran at 163 articles per 100,000 monitored (7-day average to Oct 18) vs a 12-month mean of 209; the period&#x27;s peak was Dec 14, 2025 (2495). Media attention, not attack counts.<br><span class="s">Source: <a href="https://api.gdeltproject.org/api/v2/doc/doc?query=%28%22terrorist%20attack%22%20OR%20%22suicide%20bombing%22%20OR%20%22terror%20attack%22%29&amp;mode=timelinevolraw&amp;timespan=12m" target="_blank" rel="noopener">https://api.gdeltproject.org/api/v2/doc/doc?query=%28%22terrorist%20attack%22%20OR%20%22suicide%20bombing%22%20OR%20%22terror%20attack%22%29&amp;mode=timelinevolraw&amp;timespan=12m</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g06.webp" alt="M6+ earthquake pace" loading="lazy"><figcaption><span class="t">M6+ earthquake pace.</span> 2026 has 113 M6+ quakes through Oct 20 vs a 2000-25 median of 116 by this date (range 81-182). Latest: M6.3 197 km NW of Port-Olry, Vanuatu (Oct 20, 04:20 UTC). 12 duplicate USGS solution(s) of the same event merged.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g07.webp" alt="M6+ quakes by month" loading="lazy"><figcaption><span class="t">M6+ quakes by month.</span> October 2026 has 12 M6+ quakes through Oct 20 vs a 2000-25 full-October average of 12.4; the busiest 2026 month was Jun (19).<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g08.webp" alt="Weekly M5+ quake count" loading="lazy"><figcaption><span class="t">Weekly M5+ quake count.</span> 2026 has 1,618 M5+ quakes through Oct 20 vs a 2016-25 average of 1,388 by this date (range 1,186-1,887); the busiest 2026 week was week 33 with 67.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g09.webp" alt="Solar activity proxy: F10.7 flux" loading="lazy"><figcaption><span class="t">Solar activity proxy: F10.7 flux.</span> The 10.7 cm solar radio flux, a standard proxy for solar activity and upper-atmosphere drag on satellites, was 121 sfu on Oct 19 (27-day average 113; window range 92-156).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions" target="_blank" rel="noopener">https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g10.webp" alt="Space weather this week: flares, Kp, Dst" loading="lazy"><figcaption><span class="t">Space weather this week: flares, Kp, Dst.</span> The G1 forecast for Oct 19 did not verify (max Kp 1.00); observed Kp is 1.00 so far Oct 20 (to 09:00 UTC) and Dst 12 nT. The week&#x27;s biggest flare was M1.7 (Oct 19). NOAA now forecasts a peak Kp 4.67 (NOAA Scale G1) for Oct 20 (issued 2026 Oct 20 0030 UTC).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/goes-x-ray-flux" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/goes-x-ray-flux</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g11.webp" alt="Geomagnetic activity, last 30 days" loading="lazy"><figcaption><span class="t">Geomagnetic activity, last 30 days.</span> Kp peaked at 7.00 on Oct 10 in this 30-day window; Oct 19 maxed at Kp 1.00 (the forecast G1 did not verify), and NOAA&#x27;s latest 3-day forecast (issued 2026 Oct 20 0030 UTC) has a peak Kp 4.67 (NOAA Scale G1) on Oct 20.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/planetary-k-index" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/planetary-k-index</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g12.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> The monthly sunspot number was 60 in September, past the Oct 2024 maximum; declining phases can still bring large flares and CME storms such as Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g13.webp" alt="US emergency oil buffer" loading="lazy"><figcaption><span class="t">US emergency oil buffer.</span> The SPR held 283.0M barrels in the week to Oct 9, its lowest since 1982 and 39% of its 2010 peak (727M); commercial crude was 415.6M.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g14.webp" alt="US crude self-reliance" loading="lazy"><figcaption><span class="t">US crude self-reliance.</span> US crude output was 13.68M b/d in the week to Oct 9 (2019-26 weekly high 13.98M, Oct 2, 2026); net crude imports averaged 2.07M b/d over 4 weeks.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCRFPUS2&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCRFPUS2&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g15.webp" alt="US refinery runs vs normal" loading="lazy"><figcaption><span class="t">US refinery runs vs normal.</span> US refineries ran at 93.5% of capacity in the week to Oct 9, vs a 2021-25 average of 86.7% for that week (range 84.7-89.5%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g16.webp" alt="Yield curve after inversion" loading="lazy"><figcaption><span class="t">Yield curve after inversion.</span> The 10Y-2Y spread is +0.38 pt on Oct 19 (Treasury: 10Y 5.15%, 2Y 4.77%), positive after the 2022-24 inversion; un-inversion preceded past recessions.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/T10Y2Y" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/T10Y2Y</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g17.webp" alt="Oil shock at the pump" loading="lazy"><figcaption><span class="t">Oil shock at the pump.</span> EIA Brent spot was $126.55 on Oct 14 (period peak $138 in April 2026); EIA&#x27;s US regular gasoline average was $4.33 in the week of Oct 12. Both EIA series lag the market by about a week.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/DCOILBRENTEU" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/DCOILBRENTEU</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g18.webp" alt="Energy-led inflation gap" loading="lazy"><figcaption><span class="t">Energy-led inflation gap.</span> Headline CPI was 3.7% year over year in September (from 3.4% in August) while core was 2.6%: energy is driving the gap.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CPIAUCNS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CPIAUCNS</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g19.webp" alt="The whole curve, not just 10Y-2Y" loading="lazy"><figcaption><span class="t">The whole curve, not just 10Y-2Y.</span> On Oct 19 the curve ran from 4.27% (3-month) to 5.48% (30-year), with 2Y 4.77% and 10Y 5.15%; since Sep 18 the 2Y moved +1 bp and the 10Y +14 bp.<br><span class="s">Source: <a href="https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026" target="_blank" rel="noopener">https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g20.webp" alt="Respiratory season starting" loading="lazy"><figcaption><span class="t">Respiratory season starting.</span> In the week ending Oct 10, US hospitals reported 4,001 new COVID-19 admissions (-8% week on week), 3,955 for influenza and 605 for RSV, all far below last winter&#x27;s peaks (flu peak 42,500).<br><span class="s">Source: <a href="https://data.cdc.gov/Public-Health-Surveillance/Weekly-Hospital-Respiratory-Data-HRD-Metrics-by-Ju/ua7e-t2fy" target="_blank" rel="noopener">https://data.cdc.gov/Public-Health-Surveillance/Weekly-Hospital-Respiratory-Data-HRD-Metrics-by-Ju/ua7e-t2fy</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-20/g22.webp" alt="Critical Water Shortage, US view" loading="lazy"><figcaption><span class="t">Critical Water Shortage, US view.</span> 53.7% of the contiguous US was in drought (D1-D4) on the map valid Oct 13, higher than in 93% of weeks since 2000; 9.8% was extreme or worse.<br><span class="s">Source: <a href="https://droughtmonitor.unl.edu/DmData/DataDownload.aspx" target="_blank" rel="noopener">https://droughtmonitor.unl.edu/DmData/DataDownload.aspx</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-20/g26.webp" alt="Platinum group metals" loading="lazy"><figcaption><span class="t">Platinum group metals.</span> Platinum averaged $1,784/oz in September (2010-26 high $2,434, Jan 2026); Oct 20 spot quotes at 07:04 ET are platinum $1,643 and palladium $1,128.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-20/g27.webp" alt="Oil volatility vs stock volatility" loading="lazy"><figcaption><span class="t">Oil volatility vs stock volatility.</span> On Oct 19, oil implied volatility (OVX) closed at 50.22, 2.7x the VIX (18.44); gold&#x27;s GVZ was 22.23. OVX&#x27;s 2026 closing high is 120.91 (Mar 11).<br><span class="s">Source: <a href="https://www.cboe.com/us/indices/dashboard/ovx/" target="_blank" rel="noopener">https://www.cboe.com/us/indices/dashboard/ovx/</a></span></figcaption></figure>
