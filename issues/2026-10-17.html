<figure class="g"><img src="img/2026-10-17/g06.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> Sunspots (60 in September) are past peak, but declining phases still bring large flares and CME storms like Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
