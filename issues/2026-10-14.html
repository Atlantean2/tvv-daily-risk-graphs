<figure class="g"><img src="img/2026-10-14/g01.webp" alt="Daily Geopolitical Risk index" loading="lazy"><figcaption><span class="t">Daily Geopolitical Risk index.</span> Daily GPR hit 342 on Oct 13, triple its long-run norm, as Hormuz attacks and Russia&#x27;s missile barrage hit the news.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g02.webp" alt="Oil geopolitical risk at record" loading="lazy"><figcaption><span class="t">Oil geopolitical risk at record.</span> Iacoviello&#x27;s oil-related AI-GPR read 752 in September, far above the 2003 Iraq-war and 2022 Ukraine spikes.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g03.webp" alt="Terrorism share of geopolitical risk" loading="lazy"><figcaption><span class="t">Terrorism share of geopolitical risk.</span> The terrorism component of AI-GPR rose to 11.1 in September from 7.0 in August, near its March 2026 high of 13.3.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g04.webp" alt="M6+ earthquake pace" loading="lazy"><figcaption><span class="t">M6+ earthquake pace.</span> 2026 has 110 M6+ quakes by Oct 13 vs a 2000-25 median of 114: a normal pace, so the risk is where they strike, not how often.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g05.webp" alt="Geomagnetic activity, last 30 days" loading="lazy"><figcaption><span class="t">Geomagnetic activity, last 30 days.</span> Kp peaked at 7.00 on Oct 10, a strong storm; Oct 14 has stayed below Kp 4 so far, in line with SWPC&#x27;s Kp 3.67 outlook.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/planetary-k-index" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/planetary-k-index</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g06.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> Sunspots (60 in September) are past peak, but declining phases still bring large flares and CME storms like Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g07.webp" alt="US emergency oil buffer" loading="lazy"><figcaption><span class="t">US emergency oil buffer.</span> The SPR held 283M barrels on Oct 2, its lowest since 1982 and under 40% of its 2010 peak, while Hormuz and Gulf supply are disrupted.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g08.webp" alt="Yield curve after inversion" loading="lazy"><figcaption><span class="t">Yield curve after inversion.</span> The 10Y-2Y spread is back positive at +0.37 after the 2022-24 inversion, the un-inversion phase that preceded past recessions.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/T10Y2Y" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/T10Y2Y</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g09.webp" alt="Energy-driven inflation re-acceleration" loading="lazy"><figcaption><span class="t">Energy-driven inflation re-acceleration.</span> Headline CPI jumped to 3.7% in September while core sat at 2.6%: an energy-led shock pushing the Fed toward hikes.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CPIAUCNS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CPIAUCNS</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g10.webp" alt="Oil shock at the pump" loading="lazy"><figcaption><span class="t">Oil shock at the pump.</span> Brent is $125 after an April peak of $138, above 2022&#x27;s high; US gasoline averages $4.33, driving September&#x27;s CPI jump.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/DCOILBRENTEU" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/DCOILBRENTEU</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g11.webp" alt="US measles resurgence" loading="lazy"><figcaption><span class="t">US measles resurgence.</span> NNDSS shows 4,076 US measles cases through week 40, already about double all of 2025 (2,026), matching CDC&#x27;s 4,080 count.<br><span class="s">Source: <a href="https://data.cdc.gov/NNDSS/NNDSS-Weekly-Data/x9gk-5huc" target="_blank" rel="noopener">https://data.cdc.gov/NNDSS/NNDSS-Weekly-Data/x9gk-5huc</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g12.webp" alt="Critical Water Shortage, US view" loading="lazy"><figcaption><span class="t">Critical Water Shortage, US view.</span> 55% of the contiguous US is in drought, worse than 97% of weeks since 2000; the US mirror of Maharashtra&#x27;s water cuts.<br><span class="s">Source: <a href="https://droughtmonitor.unl.edu/DmData/DataDownload.aspx" target="_blank" rel="noopener">https://droughtmonitor.unl.edu/DmData/DataDownload.aspx</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g13.webp" alt="Haven metals: high but off peak" loading="lazy"><figcaption><span class="t">Haven metals: high but off peak.</span> Gold averaged $4,319 in September, about 3x 2019 but off its $5,020 Feb 2026 peak; CPI shock took spot to $4,083 Oct 14.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g14.webp" alt="Copper at record highs" loading="lazy"><figcaption><span class="t">Copper at record highs.</span> Copper averaged $14,474/t in September, a record; Kitco&#x27;s Oct 14 spot is higher still, raising grid and AI data-center build costs.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g15.webp" alt="Calm tape, hot risk" loading="lazy"><figcaption><span class="t">Calm tape, hot risk.</span> The S&amp;P 500 sits near 7,805 with VIX at 15.3 while the GPR 30-day average stays elevated: a complacency gap.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/SP500" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/SP500</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g16.webp" alt="Hormuz normalisation odds" loading="lazy"><figcaption><span class="t">Hormuz normalisation odds.</span> Traders cut odds of normal Hormuz traffic by Dec 31 from 80% in May to 13.5%, pricing a prolonged closure.<br><span class="s">Source: <a href="https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-december-31" target="_blank" rel="noopener">https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-december-31</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g17.webp" alt="Ukraine ceasefire odds slide" loading="lazy"><figcaption><span class="t">Ukraine ceasefire odds slide.</span> Odds of a 2026 Russia-Ukraine ceasefire fell from 46% in May to 16.5%; even mid-2027 is a coin flip.<br><span class="s">Source: <a href="https://polymarket.com/event/russia-x-ukraine-ceasefire-agreement-by" target="_blank" rel="noopener">https://polymarket.com/event/russia-x-ukraine-ceasefire-agreement-by</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g18.webp" alt="Fed hike odds after CPI" loading="lazy"><figcaption><span class="t">Fed hike odds after CPI.</span> Kalshi&#x27;s Oct 28 hold slid from 82c to about 67c after the hot CPI, and a Dec 9 hike trades near 77c: tightening risk is back.<br><span class="s">Source: <a href="https://kalshi.com/markets/kxfeddecision" target="_blank" rel="noopener">https://kalshi.com/markets/kxfeddecision</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g19.webp" alt="SI-AGI arrival odds" loading="lazy"><figcaption><span class="t">SI-AGI arrival odds.</span> Markets price AGI before 2027 at 12-13.5% but before 2028 near 56%: a fast-closing window for AI governance risk.<br><span class="s">Source: <a href="https://kalshi.com/markets/kxagico/will-any-company-achieve-agi-before-date/kxagico-comp" target="_blank" rel="noopener">https://kalshi.com/markets/kxagico/will-any-company-achieve-agi-before-date/kxagico-comp</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-14/g20.webp" alt="AI capability scaling" loading="lazy"><figcaption><span class="t">AI capability scaling.</span> Training compute for notable models keeps compounding roughly 5.9x a year, the scaling engine behind SI-AGI risk.<br><span class="s">Source: <a href="https://epoch.ai/data/ai-models" target="_blank" rel="noopener">https://epoch.ai/data/ai-models</a></span></figcaption></figure></main></body></html>
