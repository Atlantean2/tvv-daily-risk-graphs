<figure class="g"><img src="img/2026-10-21/g01.webp" alt="Oil geopolitical risk: off the March peak, still high" loading="lazy"><figcaption><span class="t">Oil geopolitical risk: off the March peak, still high.</span> Iacoviello&#x27;s oil-related AI-GPR read 752 in September, below the March 2026 record of 1,844 but above the 2003 Iraq-war (515) and 2022 Ukraine (736) readings.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g02.webp" alt="Threats vs acts" loading="lazy"><figcaption><span class="t">Threats vs acts.</span> In the week to Oct 19 the threats sub-index averaged 207 and the acts sub-index 187 (2026 highs of the 7-day averages: threats 396 on Mar 5, acts 501 on Mar 15).<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g03.webp" alt="Violence against civilians in context" loading="lazy"><figcaption><span class="t">Violence against civilians in context.</span> UCDP&#x27;s candidate events record 138,860 deaths Jan-Sep 2026, 27,236 of them in one-sided violence against civilians (top: Iran 19,901, Nigeria 1,884, DR Congo (Zaire) 1,357). January&#x27;s 39,878 is mostly UCDP&#x27;s estimate for the Iranian government&#x27;s Jan 8 killings of civilians (state, not terrorist, violence); September 13,286. Candidate data are preliminary.<br><span class="s">Source: <a href="https://ucdp.uu.se/downloads/index.html#candidate" target="_blank" rel="noopener">https://ucdp.uu.se/downloads/index.html#candidate</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g04.webp" alt="Weekly M5+ quake count" loading="lazy"><figcaption><span class="t">Weekly M5+ quake count.</span> 2026 has 1,624 M5+ quakes through Oct 21 vs a 2016-25 average of 1,392 by this date (range 1,191-1,890); the busiest 2026 week was week 33 with 67.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g05.webp" alt="The month ahead in space weather" loading="lazy"><figcaption><span class="t">The month ahead in space weather.</span> SWPC&#x27;s 27-day outlook (issued 2026 Oct 19 0141 UTC) flags its next Kp 5 (G1-level) days on Oct 31, Nov 1 (Oct 21: Kp 4), with radio flux 85-105 sfu. It is a recurrence-based outlook, not a storm warning.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/27-day-outlook-107-cm-radio-flux-and-geomagnetic-indices" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/27-day-outlook-107-cm-radio-flux-and-geomagnetic-indices</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g06.webp" alt="Solar activity proxy: F10.7 flux" loading="lazy"><figcaption><span class="t">Solar activity proxy: F10.7 flux.</span> The 10.7 cm solar radio flux, a standard proxy for solar activity and upper-atmosphere drag on satellites, was 120 sfu on Oct 20 (27-day average 113; window range 92-156).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions" target="_blank" rel="noopener">https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g07.webp" alt="Geomagnetic activity, last 30 days" loading="lazy"><figcaption><span class="t">Geomagnetic activity, last 30 days.</span> Kp peaked at 7.00 on Oct 10 in this 30-day window; Oct 20 maxed at Kp 3.00 (UTC day), and NOAA&#x27;s latest 3-day forecast (issued 2026 Oct 21 0030 UTC) has a peak Kp 4.67 (NOAA Scale G1) on Oct 21.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/planetary-k-index" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/planetary-k-index</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g08.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> The monthly sunspot number was 60 in September, past the Oct 2024 maximum; declining phases can still bring large flares and CME storms such as Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g09.webp" alt="US oil demand vs normal" loading="lazy"><figcaption><span class="t">US oil demand vs normal.</span> US products supplied averaged 21.08M b/d over the 4 weeks to Oct 9 (single week 21.36M), vs a 2021-25 average of 20.60M for that week (range 20.22-20.91M).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WRPUPUS2&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WRPUPUS2&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g10.webp" alt="US refinery runs vs normal" loading="lazy"><figcaption><span class="t">US refinery runs vs normal.</span> US refineries ran at 93.5% of capacity in the week to Oct 9, vs a 2021-25 average of 86.7% for that week (range 84.7-89.5%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g11.webp" alt="Yield curve after inversion" loading="lazy"><figcaption><span class="t">Yield curve after inversion.</span> The 10Y-2Y spread is +0.33 pt on Oct 20 (Treasury: 10Y 5.12%, 2Y 4.79%), positive after the 2022-24 inversion; un-inversion preceded past recessions.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/T10Y2Y" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/T10Y2Y</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g12.webp" alt="Energy-led inflation gap" loading="lazy"><figcaption><span class="t">Energy-led inflation gap.</span> Headline CPI was 3.7% year over year in September (from 3.4% in August) while core was 2.6%: energy is driving the gap.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CPIAUCNS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CPIAUCNS</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g13.webp" alt="Inflation expectations in the bond market" loading="lazy"><figcaption><span class="t">Inflation expectations in the bond market.</span> On Oct 20 the 10Y par yield was 5.12% and the 10Y real (TIPS) yield 2.77%, a breakeven of 2.35 points (2026 range 2.18-2.50). Breakeven also carries an inflation-risk premium.<br><span class="s">Source: <a href="https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_real_yield_curve&amp;field_tdr_date_value=2026" target="_blank" rel="noopener">https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_real_yield_curve&amp;field_tdr_date_value=2026</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g14.webp" alt="Critical Water Shortage, US view" loading="lazy"><figcaption><span class="t">Critical Water Shortage, US view.</span> 53.7% of the contiguous US was in drought (D1-D4) on the map valid Oct 13, higher than in 93% of weeks since 2000; 9.8% was extreme or worse.<br><span class="s">Source: <a href="https://droughtmonitor.unl.edu/DmData/DataDownload.aspx" target="_blank" rel="noopener">https://droughtmonitor.unl.edu/DmData/DataDownload.aspx</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g15.webp" alt="Haven metals" loading="lazy"><figcaption><span class="t">Haven metals.</span> Gold averaged $4,319 in September (2010-26 monthly high $5,020, Feb 2026) and silver $64.60; gold-api.com spot at 07:02 ET Oct 21 is gold $4,129, silver $57.70.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g16.webp" alt="Gold vs real rates" loading="lazy"><figcaption><span class="t">Gold vs real rates.</span> GLD closed at $377.65 on Oct 20, 23.8% below its Jan 29, 2026 high of $495.90; the 10Y real yield is 2.77%. 2026 daily correlation of GLD returns with real-yield changes: -0.29.<br><span class="s">Source: <a href="https://www.nasdaq.com/market-activity/etf/gld/historical" target="_blank" rel="noopener">https://www.nasdaq.com/market-activity/etf/gld/historical</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-21/g17.webp" alt="Platinum group metals" loading="lazy"><figcaption><span class="t">Platinum group metals.</span> Platinum averaged $1,784/oz in September (2010-26 high $2,434, Jan 2026); Oct 21 spot quotes at 07:02 ET are platinum $1,644 and palladium $1,113.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-21/g23.webp" alt="The US-China AI model race" loading="lazy"><figcaption><span class="t">The US-China AI model race.</span> Epoch&#x27;s database lists 84 notable AI models for 2026 to Sep 30: 49 from US organizations and 29 from Chinese ones (2025: 62 US, 33 China, 107 total). Recent years fill in as Epoch adds models.<br><span class="s">Source: <a href="https://epoch.ai/data/ai-models" target="_blank" rel="noopener">https://epoch.ai/data/ai-models</a></span></figcaption></figure></main></body></html>
