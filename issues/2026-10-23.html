<figure class="g"><img src="img/2026-10-23/g01.webp" alt="Geopolitical risk by event type" loading="lazy"><figcaption><span class="t">Geopolitical risk by event type.</span> In September 2026 the AI-GPR index was 179 (2025 average 170); military conflict contributed 88 points (2025 average 63), diplomatic tension 43 and sanctions 13 (2025 average 15.3). Peak since 2022: 319 in March 2022.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g02.webp" alt="Where geopolitical risk is concentrated" loading="lazy"><figcaption><span class="t">Where geopolitical risk is concentrated.</span> In September 2026, United States (3.91% of articles, vs 3.61% in 2025), Israel (1.61%) and Russia (1.48%) led the Caldara-Iacoviello country GPR rankings.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g03.webp" alt="Terrorism share of geopolitical risk" loading="lazy"><figcaption><span class="t">Terrorism share of geopolitical risk.</span> The terrorism component of AI-GPR was 11.1 in September vs 7.0 in August; the 2026 monthly high is 13.3 (March) and the 12-month average is 10.5.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/ai_gpr.html" target="_blank" rel="noopener">https://www.matteoiacoviello.com/ai_gpr.html</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g04.webp" alt="Terror acts vs terror threats" loading="lazy"><figcaption><span class="t">Terror acts vs terror threats.</span> In September 2026, terror-act articles were 0.42% of all articles (2025 average 0.55%) and terror-threat articles 0.09% (2025 average 0.19%), far below the 9/11 peak of 8.8%.<br><span class="s">Source: <a href="https://www.matteoiacoviello.com/gpr.htm" target="_blank" rel="noopener">https://www.matteoiacoviello.com/gpr.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g05.webp" alt="Where the earth shook this month" loading="lazy"><figcaption><span class="t">Where the earth shook this month.</span> USGS logged 695 M4.5+ quakes in the 30 days to Oct 23, 14 of them M6+; the largest was M7.7 12 km WSW of Pitaloza Arriba, Panama on Oct 9 (UTC).<br><span class="s">Source: <a href="https://earthquake.usgs.gov/earthquakes/map/" target="_blank" rel="noopener">https://earthquake.usgs.gov/earthquakes/map/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g06.webp" alt="M6+ earthquake pace" loading="lazy"><figcaption><span class="t">M6+ earthquake pace.</span> 2026 has 114 M6+ quakes through Oct 22 vs a 2000-25 median of 117 by this date (range 81-185). Latest: M7.0 191 km ENE of Nagqu, China (Oct 22, 14:33 UTC). 12 duplicate USGS solution(s) of the same event merged.<br><span class="s">Source: <a href="https://earthquake.usgs.gov/fdsnws/event/1/" target="_blank" rel="noopener">https://earthquake.usgs.gov/fdsnws/event/1/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g07.webp" alt="Solar activity proxy: F10.7 flux" loading="lazy"><figcaption><span class="t">Solar activity proxy: F10.7 flux.</span> The 10.7 cm solar radio flux, a standard proxy for solar activity and upper-atmosphere drag on satellites, was 106 sfu on Oct 22 (27-day average 113; window range 92-156).<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions" target="_blank" rel="noopener">https://www.swpc.noaa.gov/phenomena/f107-cm-radio-emissions</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g08.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> The monthly sunspot number was 60 in September, past the Oct 2024 maximum; declining phases can still bring large flares and CME storms such as Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g09.webp" alt="Brent-WTI premium: $38 to $7" loading="lazy"><figcaption><span class="t">Brent-WTI premium: $38 to $7.</span> EIA daily spot: Brent $115.22, WTI $107.89 on Oct 20, a $7.33 Brent premium, down from $37.62 on Oct 2 (2024 average $3.93). A wide Brent premium signals seaborne (Gulf-exposed) crude scarcity relative to landlocked US supply; the narrowing means that stress has eased on paper even as both prices stay high.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/RBRTED.htm" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/RBRTED.htm</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g10.webp" alt="US emergency oil buffer" loading="lazy"><figcaption><span class="t">US emergency oil buffer.</span> The SPR held 282.7M barrels in the week to Oct 16, its lowest since 1982 and 39% of its 2010 peak (727M); commercial crude was 412.5M.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g11.webp" alt="US fuel stocks" loading="lazy"><figcaption><span class="t">US fuel stocks.</span> In the week to Oct 16, US gasoline stocks were 205.3M barrels (-4.7% vs the 2021-25 average) and distillate stocks 104.3M (-9.0%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WGTSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WGTSTUS1&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g12.webp" alt="US refinery runs vs normal" loading="lazy"><figcaption><span class="t">US refinery runs vs normal.</span> US refineries ran at 93.4% of capacity in the week to Oct 16, vs a 2021-25 average of 87.5% for that week (range 85.1-89.5%).<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WPULEUS3&amp;f=W</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g13.webp" alt="Yield curve after inversion" loading="lazy"><figcaption><span class="t">Yield curve after inversion.</span> The 10Y-2Y spread is +0.31 pt on Oct 22 (Treasury: 10Y 4.96%, 2Y 4.65%), positive after the 2022-24 inversion; un-inversion preceded past recessions.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/T10Y2Y" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/T10Y2Y</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g14.webp" alt="Oil shock at the pump" loading="lazy"><figcaption><span class="t">Oil shock at the pump.</span> EIA Brent spot was $115.22 on Oct 20 (period peak $138 in April 2026); EIA&#x27;s US regular gasoline average was $4.28 in the week of Oct 19. Both EIA series lag the market by about a week.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/DCOILBRENTEU" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/DCOILBRENTEU</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g15.webp" alt="Energy-led inflation gap" loading="lazy"><figcaption><span class="t">Energy-led inflation gap.</span> Headline CPI was 3.7% year over year in September (from 3.4% in August) while core was 2.6%: energy is driving the gap.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CPIAUCNS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CPIAUCNS</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g16.webp" alt="Bills vs notes before the FOMC" loading="lazy"><figcaption><span class="t">Bills vs notes before the FOMC.</span> US Treasury par yields on Oct 22: 3-month 4.22%, 2-year 4.65%, 10-year 4.96%. The 2-year sits 43 bp above the 3-month bill (vs -18 bp on Jan 2, low -29 bp on Feb 27), i.e. markets price higher policy rates ahead; the FOMC decides Oct 28.<br><span class="s">Source: <a href="https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026" target="_blank" rel="noopener">https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&amp;field_tdr_date_value=2026</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g17.webp" alt="US measles resurgence" loading="lazy"><figcaption><span class="t">US measles resurgence.</span> NNDSS shows 4,278 US measles cases through MMWR week 41 of 2026, 2.1x all of 2025 (2,026); latest provisional week posted as of 7 AM ET Oct 23.<br><span class="s">Source: <a href="https://data.cdc.gov/NNDSS/NNDSS-Weekly-Data/x9gk-5huc" target="_blank" rel="noopener">https://data.cdc.gov/NNDSS/NNDSS-Weekly-Data/x9gk-5huc</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g18.webp" alt="Is the Ebola response keeping up?" loading="lazy"><figcaption><span class="t">Is the Ebola response keeping up?.</span> INSP SitRep 159 (situation Oct 20): 7-day average lab positivity 14.7% (peak 7-day 52.4% around May 29); 78.7% of listed contacts seen daily (7-day avg); 30,130 contacts under follow-up. Lower positivity and higher follow-up mean better control. SitRep 160 not yet posted at ~7:00 AM ET Oct 23; values as transcribed by ebola-tracker.org from INSP PDFs.<br><span class="s">Source: <a href="https://ebola-tracker.org/en/database/" target="_blank" rel="noopener">https://ebola-tracker.org/en/database/</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g19.webp" alt="Haven metals" loading="lazy"><figcaption><span class="t">Haven metals.</span> Gold averaged $4,319 in September (2010-26 monthly high $5,020, Feb 2026) and silver $64.60; gold-api.com spot at 06:58 ET Oct 23 is gold $4,024, silver $54.04.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g20.webp" alt="Gold-to-silver ratio" loading="lazy"><figcaption><span class="t">Gold-to-silver ratio.</span> An ounce of gold buys 74.5 ounces of silver at the Friday-morning spot (gold $4,024, silver $54.04), vs 66.9 in September and a 1990-2026 average of 70.<br><span class="s">Source: <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">https://www.worldbank.org/en/research/commodity-markets</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-23/g22.webp" alt="Stocks vs volatility and geopolitical risk" loading="lazy"><figcaption><span class="t">Stocks vs volatility and geopolitical risk.</span> The S&amp;P 500 fell 1.21% to 7,663.43 on Oct 22, +5.2% vs its 200-day average, with VIX at 19.03; the GPR 30-day average was 176 on Oct 19.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/SP500" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/SP500</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-23/g24.webp" alt="Fed odds five days before the FOMC" loading="lazy"><figcaption><span class="t">Fed odds five days before the FOMC.</span> Kalshi&#x27;s Oct 28 hold trades about 94c at 06:00 ET Oct 23, and a Dec 9 hike about 73c: traders see a hold next week with hike risk later.<br><span class="s">Source: <a href="https://kalshi.com/markets/kxfeddecision" target="_blank" rel="noopener">https://kalshi.com/markets/kxfeddecision</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-23/g26.webp" alt="FOMC: hold priced, dissents expected" loading="lazy"><figcaption><span class="t">FOMC: hold priced, dissents expected.</span> Polymarket ~06:58 ET Oct 23: no change Oct 28 93.5%, 25 bp hike 6.5%. Dissent count: none 24.0%, one 15.5%, two 28.0%, three 18.0%, four+ 12.5% (100 minus the none price implies about 76% odds of at least one dissent; the dissent market is thin, ~$33K volume, and its prices need not sum to 100). Crowd prices, not Fed guidance.<br><span class="s">Source: <a href="https://polymarket.com/event/fed-decision-in-october-20260617190323537" target="_blank" rel="noopener">https://polymarket.com/event/fed-decision-in-october-20260617190323537</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g27.webp" alt="Ukraine ceasefire odds" loading="lazy"><figcaption><span class="t">Ukraine ceasefire odds.</span> Odds of a Russia-Ukraine ceasefire by Dec 31 are 19.5% (from 46% in May); by mid-2027 they are 55.5%.<br><span class="s">Source: <a href="https://polymarket.com/event/russia-x-ukraine-ceasefire-agreement-by" target="_blank" rel="noopener">https://polymarket.com/event/russia-x-ukraine-ceasefire-agreement-by</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g28.webp" alt="Summit talk vs summit odds" loading="lazy"><figcaption><span class="t">Summit talk vs summit odds.</span> Polymarket ~07:00 ET Oct 23: Trump, Putin and Zelensky meet together before 2027 9%; seen together before 2027 8%; Putin and Zelenskyy do not meet at all by end-2027 78%. The meet-before-2027 price ranged 4.0-9.5% in October despite Kremlin talk of trilateral talks in mid-November. Thin markets ($60K-$108K volume); crowd prices, not forecasts.<br><span class="s">Source: <a href="https://polymarket.com/event/trump-putin-and-zelensky-meet-together-before-2027" target="_blank" rel="noopener">https://polymarket.com/event/trump-putin-and-zelensky-meet-together-before-2027</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-23/g29.webp" alt="AI megacaps split" loading="lazy"><figcaption><span class="t">AI megacaps split.</span> Price change Dec 31, 2025 to Oct 22 close: AAPL +28.1%; NVDA +13.8%; AMZN +8.5%; MSFT +7.7%; GOOGL +3.6%; META -1.7%; AVGO -6.6%; TSLA -16.7%; Nasdaq-100 (QQQ) +14.7%. 1 of the 8 beat the index. Nasdaq.com closes, price only.<br><span class="s">Source: <a href="https://www.nasdaq.com/market-activity/stocks/nvda/historical" target="_blank" rel="noopener">https://www.nasdaq.com/market-activity/stocks/nvda/historical</a></span></figcaption></figure></main></body></html>
