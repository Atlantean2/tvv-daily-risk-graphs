<figure class="g"><img src="img/2026-10-16/g05.webp" alt="Geomagnetic activity, last 30 days" loading="lazy"><figcaption><span class="t">Geomagnetic activity, last 30 days.</span> Kp peaked at 7.00 on Oct 10, a strong storm; since then quiet, with Oct 16 so far at max Kp 3.33 and SWPC expecting no storms (max Kp 2.67) through Oct 18.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/planetary-k-index" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/planetary-k-index</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-16/g06.webp" alt="Solar Cycle 25 progression" loading="lazy"><figcaption><span class="t">Solar Cycle 25 progression.</span> Sunspots (60 in September) are past peak, but declining phases still bring large flares and CME storms like Oct 10&#x27;s.<br><span class="s">Source: <a href="https://www.swpc.noaa.gov/products/solar-cycle-progression" target="_blank" rel="noopener">https://www.swpc.noaa.gov/products/solar-cycle-progression</a></span></figcaption></figure>
<figure class="g"><img src="img/2026-10-16/g07.webp" alt="US emergency oil buffer" loading="lazy"><figcaption><span class="t">US emergency oil buffer.</span> The SPR held 283M barrels on Oct 9, its lowest since 1982 and under 40% of its 2010 peak, while Hormuz and Gulf supply are disrupted.<br><span class="s">Source: <a href="https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W" target="_blank" rel="noopener">https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&amp;s=WCSSTUS1&amp;f=W</a></span></figcaption></figure>

<figure class="g"><img src="img/2026-10-16/g15.webp" alt="Calm tape, hot risk" loading="lazy"><figcaption><span class="t">Calm tape, hot risk.</span> The S&amp;P 500 rose 0.3% to 7,744 on Oct 15 (VIX 16.5), yet both sit far calmer than the elevated GPR: a complacency gap.<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/SP500" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/SP500</a></span></figcaption></figure>
